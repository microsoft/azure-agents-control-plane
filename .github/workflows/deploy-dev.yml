# =============================================================================
# Deploy to Dev — Triggered on push to main or manually
# =============================================================================
name: Deploy Dev

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AZURE_ENV_NAME: agents-dev
  FABRIC_ENVIRONMENT: dev
  AZD_INITIAL_ENVIRONMENT_CONFIG: infra/main.parameters.dev.json

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Azure Developer CLI
        uses: Azure/setup-azd@v2

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Provision infrastructure (Dev)
        run: |
          azd env new ${{ env.AZURE_ENV_NAME }} --no-prompt
          azd env set AZURE_LOCATION ${{ vars.AZURE_LOCATION || 'westus3' }}
          azd env set FABRIC_ENABLED true
          azd env set FABRIC_DATA_AGENTS_ENABLED true
          azd env set FABRIC_ENVIRONMENT dev
          azd env set FABRIC_SKU F2
          azd env set DEFENDER_ENABLED false
          azd env set VNET_ENABLED false
          azd provision --no-prompt

      - name: Deploy Fabric workspace (Dev)
        run: |
          pwsh ./scripts/deploy-fabric-workspace.ps1 -WorkspaceName "agents-dev-ws"

      - name: Validate OneLake connectivity
        run: |
          python -c "
          import os, sys
          sys.path.insert(0, 'src')
          os.environ['FABRIC_ENVIRONMENT'] = 'dev'
          from fabric_onelake import onelake_validate_connection_tool
          import json
          result = json.loads(onelake_validate_connection_tool())
          print(json.dumps(result, indent=2))
          if not result['success']:
              print('::warning::OneLake connectivity validation failed in dev')
          "

      - name: Build and deploy to AKS (Dev)
        run: azd deploy --no-prompt
