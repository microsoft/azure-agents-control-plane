# =============================================================================
# Deploy to Prod — Triggered manually with approval gate
# =============================================================================
name: Deploy Prod

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'deploy-prod' to confirm production deployment"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  AZURE_ENV_NAME: agents-prod
  FABRIC_ENVIRONMENT: prod
  AZD_INITIAL_ENVIRONMENT_CONFIG: infra/main.parameters.prod.json

jobs:
  validate-input:
    runs-on: ubuntu-latest
    steps:
      - name: Validate confirmation
        if: github.event.inputs.confirm != 'deploy-prod'
        run: |
          echo "::error::Confirmation mismatch. Type 'deploy-prod' to proceed."
          exit 1

  deploy-prod:
    runs-on: ubuntu-latest
    needs: validate-input
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Azure Developer CLI
        uses: Azure/setup-azd@v2

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Provision infrastructure (Prod)
        run: |
          azd env new ${{ env.AZURE_ENV_NAME }} --no-prompt
          azd env set AZURE_LOCATION ${{ vars.AZURE_LOCATION || 'westus3' }}
          azd env set FABRIC_ENABLED true
          azd env set FABRIC_DATA_AGENTS_ENABLED true
          azd env set FABRIC_ENVIRONMENT prod
          azd env set FABRIC_SKU F8
          azd env set DEFENDER_ENABLED true
          azd env set VNET_ENABLED true
          azd env set AGENT_IDENTITY_ENABLED true
          azd env set PURVIEW_ENABLED true
          azd provision --no-prompt

      - name: Deploy Fabric workspace (Prod)
        run: |
          pwsh ./scripts/deploy-fabric-workspace.ps1 -WorkspaceName "agents-prod-ws"

      - name: Validate OneLake connectivity
        run: |
          python -c "
          import os, sys
          sys.path.insert(0, 'src')
          os.environ['FABRIC_ENVIRONMENT'] = 'prod'
          from fabric_onelake import onelake_validate_connection_tool
          import json
          result = json.loads(onelake_validate_connection_tool())
          print(json.dumps(result, indent=2))
          if not result['success']:
              print('::error::OneLake connectivity validation failed in prod')
              sys.exit(1)
          "

      - name: Build and deploy to AKS (Prod)
        run: azd deploy --no-prompt

      - name: Post-deployment health check
        run: |
          echo "Waiting for deployment rollout..."
          sleep 30
          # Health check would be done via kubectl or HTTP probe
          echo "Production deployment complete"
