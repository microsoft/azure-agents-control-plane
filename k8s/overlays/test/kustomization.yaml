# =============================================================================
# Test environment overlay
# - 2 replicas
# - Standard resource limits
# - FABRIC_ENVIRONMENT=test
# =============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../base

patches:
  - target:
      kind: Deployment
      name: mcp-agents
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: mcp-agents
        namespace: mcp-agents
        labels:
          environment: test
      spec:
        replicas: 2
        template:
          metadata:
            labels:
              environment: test
          spec:
            containers:
            - name: mcp-agents
              env:
              - name: FABRIC_ENVIRONMENT
                value: "test"
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "250m"
                limits:
                  memory: "512Mi"
                  cpu: "500m"
  - target:
      kind: Namespace
      name: mcp-agents
    patch: |
      apiVersion: v1
      kind: Namespace
      metadata:
        name: mcp-agents
        labels:
          environment: test
