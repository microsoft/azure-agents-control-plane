# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: azure-agents-control-plane
metadata:
  template: azure-agents-control-plane@1.0.0
  
services:
  mcp-agents:
    project: ./src/
    language: python
    host: aks
    resourceName: ${AKS_CLUSTER_NAME}
    docker:
      remoteBuild: true

# The postprovision hook builds and deploys the selected Python or TypeScript image.
workflows:
  up:
    steps:
      - azd: provision
    
hooks:
  postprovision:
    windows:
      shell: pwsh
      run: ./infra/hooks/postprovision.ps1
      continueOnError: false
      interactive: true
    
    posix:
      shell: sh
      run: ./infra/hooks/postprovision.sh
      continueOnError: false
      interactive: true
